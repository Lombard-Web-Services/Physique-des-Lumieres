<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Figures 1, 4, 5, 6 — Forces en 3D</title>
<style>

<body>

<canvas id="c"></canvas>

<div id="figureTitle">
  <span class="fig-name" id="figCaption">Équilibre de trois forces concourantes</span>
  <div class="fig-rule"></div>
</div>

<div id="panel">
  <h3 id="panelHeader">
    <span>Paramètres</span>
    <span class="grip">⠿</span>
  </h3>
  <div class="row">
    <label>Figure</label>
    <select id="figSelect">
      <option value="1">Figure 1 — Équilibre</option>
      <option value="4">Figure 2 — Résultante P+Q</option>
      <option value="5">Figure 3 — Forces parallèles</option>
      <option value="6">Figure 4 — Parallélogramme</option>
    </select>
  </div>
  <div class="row">
    <label>Durée</label>
    <input type="range" id="durationSlider" min="200" max="8000" step="100" value="2500">

  </div>
  <div class="row">
    <label>Rotation</label>
    <input type="range" id="rotSpeed" min="0.1" max="2" step="0.05" value="0.6">
    <span class="value" id="rotSpeedValue">0.6</span>
  </div>
  <div class="row">
    <label>Zoom</label>
    <input type="range" id="zoomSlider" min="0.4" max="2" step="0.05" value="1">
    <span class="value" id="zoomValue">1.0</span>
  </div>
  <button id="replayBtn">↻ Rejouer l'apparition</button>
  <div class="hint">
    Clic + glisser sur le fond pour tourner en 3D.<br>
    Le curseur disparaît pendant la rotation.<br>
    Pas de rotation automatique.
  </div>
</div>

<script>
// ============================================================
//  CANVAS
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
//  PARAMÈTRES
// ============================================================
let currentFigure = 1;
let appearanceDuration = 2500;
let rotationSpeed = 0.6;
let zoomFactor = 1.0;

// ============================================================
//  ÉTAT ANIMATION
// ============================================================
let animStartTime = null;
let animProgress = 0;
let animDone = false;

// ============================================================
//  CAMÉRA
// ============================================================
let camTheta = 0;
let camPhi = 0.15;
let isDragging = false;
let lastMouseX = 0, lastMouseY = 0;
const PHI_MIN = -Math.PI / 2 + 0.05;
const PHI_MAX =  Math.PI / 2 - 0.05;

// ============================================================
//  PROJECTION 3D
// ============================================================
const FOCAL = 900;
function project(x, y, z) {
  const cosT = Math.cos(camTheta), sinT = Math.sin(camTheta);
  let x1 =  x * cosT + z * sinT;
  let z1 = -x * sinT + z * cosT;
  let y1 =  y;

  const cosP = Math.cos(camPhi), sinP = Math.sin(camPhi);
  let y2 = y1 * cosP - z1 * sinP;
  let z2 = y1 * sinP + z1 * cosP;
  let x2 = x1;

  const camDist = 700;
  const zCam = z2 + camDist;
  const scale = (FOCAL / zCam) * zoomFactor;

  return {
    x: W / 2 + x2 * scale,
    y: H / 2 - y2 * scale,
    z: zCam,
    scale: scale
  };
}

// ============================================================
//  DESSIN FLÈCHE 3D
// ============================================================
function drawArrow3D(x1, y1, z1, x2, y2, z2, color, label, t, opts = {}) {
  const ex = x1 + (x2 - x1) * t;
  const ey = y1 + (y2 - y1) * t;
  const ez = z1 + (z2 - z1) * t;

  const p1 = project(x1, y1, z1);
  const p2 = project(ex, ey, ez);

  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  const len = Math.hypot(dx, dy);
  if (len < 1) return;

  const angle = Math.atan2(dy, dx);
  const headLen = (opts.headLen || 16) * p2.scale;

  ctx.strokeStyle = color;
  ctx.lineWidth = (opts.lineWidth || 2.8) * p2.scale;
  ctx.lineCap = 'round';
  if (opts.dashed) {
    ctx.save();
    ctx.setLineDash([8, 6]);
  }
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
  if (opts.dashed) ctx.restore();

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(p2.x, p2.y);
  ctx.lineTo(
    p2.x - headLen * Math.cos(angle - Math.PI / 7),
    p2.y - headLen * Math.sin(angle - Math.PI / 7)
  );
  ctx.lineTo(
    p2.x - headLen * Math.cos(angle + Math.PI / 7),
    p2.y - headLen * Math.sin(angle + Math.PI / 7)
  );
  ctx.closePath();
  ctx.fill();

  if (label && t > 0.5) {
    const alpha = Math.min(1, (t - 0.5) * 2);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    const fontSize = Math.max(14, Math.round(22 * p2.scale));
    ctx.font = `italic ${fontSize}px Georgia, serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const offset = 20 * p2.scale;
    ctx.fillText(
      label,
      p2.x + Math.cos(angle) * offset,
      p2.y + Math.sin(angle) * offset
    );
    ctx.globalAlpha = 1;
  }
}

// ============================================================
//  DESSIN POINT 3D
// ============================================================
function drawPoint3D(x, y, z, color, label, offsetLabel = [12, -10]) {
  const p = project(x, y, z);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 5 * p.scale, 0, Math.PI * 2);
  ctx.fill();

  if (label) {
    ctx.fillStyle = color;
    const fontA = Math.max(14, Math.round(22 * p.scale));
    ctx.font = `italic ${fontA}px Georgia, serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText(label, p.x + offsetLabel[0] * p.scale, p.y + offsetLabel[1] * p.scale);
  }
}

// ============================================================
//  DESSIN D'UN SEGMENT 3D SIMPLE
// ============================================================
function drawLine3D(p1, p2, color, width, dashed, t) {
  if (t <= 0) return;
  const ex = p1[0] + (p2[0] - p1[0]) * t;
  const ey = p1[1] + (p2[1] - p1[1]) * t;
  const ez = p1[2] + (p2[2] - p1[2]) * t;

  const a = project(...p1);
  const b = project(ex, ey, ez);

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width * b.scale;
  ctx.lineCap = 'round';
  if (dashed) ctx.setLineDash([5, 6]);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.restore();
}

// ============================================================
//  GRILLE DE SOL
// ============================================================
function drawFloorGrid() {
  const gridSize = 500;
  const step = 100;
  ctx.strokeStyle = 'rgba(80, 80, 100, 0.18)';
  ctx.lineWidth = 1;
  for (let i = -gridSize; i <= gridSize; i += step) {
    let p1 = project(i, -300, -gridSize);
    let p2 = project(i, -300,  gridSize);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();

    p1 = project(-gridSize, -300, i);
    p2 = project( gridSize, -300, i);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }
}

// ============================================================
//  GÉOMÉTRIE DES FIGURES
// ============================================================
function getFigureScene(figNum) {
  switch (figNum) {

    // --------------------------------------------------------
    // FIGURE 1 — Équilibre de trois forces concourantes
    // --------------------------------------------------------
    case 1:
      return {
        caption: "Équilibre de trois forces concourantes",
        points: [
          { pos: [0, 0, 0], color: '#fff', label: 'A' }
        ],
        arrows: [
          { from: [0,0,0], to: [170, -130,  60], color: '#ff5555', label: 'P', tRange: [0.15, 0.55] },
          { from: [0,0,0], to: [-170,-130, -60], color: '#55aaff', label: 'Q', tRange: [0.25, 0.65] },
          { from: [0,0,0], to: [0,  -130,   0], color: '#55ff88', label: 'R', tRange: [0.55, 0.85] },
          { from: [0,0,0], to: [0,   220,   0], color: '#ffffff', label: 'S', tRange: [0.00, 0.40] }
        ],
        dashedLines: [
          { from: [0,0,0], to: [0,-130,0], tRange: [0.6, 1.0] }
        ],
        legend: [
          { color: '#ffffff', text: 'S — force opposée à la résultante de P et Q' },
          { color: '#ff5555', text: 'P, Q — forces composantes' },
          { color: '#55ff88', text: 'R — résultante de P et Q  (R = P + Q)' },
          { color: '#888',    text: 'Ligne pointillée AR — prolongement de SA' }
        ]
      };

    // --------------------------------------------------------
    // FIGURE 4 — Direction intermédiaire AR
    // --------------------------------------------------------
    case 4:
      return {
        caption: "Direction intermédiaire de la résultante",
        points: [
          { pos: [0, 0, 0], color: '#fff', label: 'A' }
        ],
        arrows: [
          { from: [0,0,0], to: [180, -140, 60], color: '#ff5555', label: 'P', tRange: [0.10, 0.50] },
          { from: [0,0,0], to: [-180,-140, -60], color: '#55aaff', label: 'Q', tRange: [0.25, 0.65] },
          { from: [0,0,0], to: [0,  -200,  0], color: '#55ff88', label: 'R', tRange: [0.55, 0.95], dashed: true }
        ],
        dashedLines: [],
        legend: [
          { color: '#ff5555', text: 'P, Q — forces appliquées au point A' },
          { color: '#55ff88', text: 'R — direction intermédiaire (résultante)' },
          { color: '#888',    text: 'Le corps se meut suivant la direction AR' }
        ]
      };

    // --------------------------------------------------------
    // FIGURE 5 — Forces parallèles
    // --------------------------------------------------------
    case 5:
      const Ax5 = -200, Bx5 = 200;
      const yTop5 = 100;
      const Cx5 = Ax5 + (Bx5 - Ax5) * 15 / (15 + 20);

      const lenP5 = 160;
      const lenQ5 = 120;
      const lenR5 = 280;

      return {
        caption: "Forces parallèles — P = 20, Q = 15, R = 35",
        points: [
          { pos: [Ax5, yTop5, 0], color: '#ffffff', label: 'A' },
          { pos: [Bx5, yTop5, 0], color: '#ffffff', label: 'B' },
          { pos: [Cx5, yTop5, 0], color: '#55ff88', label: 'C' }
        ],
        arrows: [
          { from: [Ax5, yTop5, 0], to: [Ax5, yTop5 - lenP5, 0], color: '#ff5555', label: 'P', tRange: [0.10, 0.55] },
          { from: [Bx5, yTop5, 0], to: [Bx5, yTop5 - lenQ5, 0], color: '#55aaff', label: 'Q', tRange: [0.25, 0.70] },
          { from: [Cx5, yTop5, 0], to: [Cx5, yTop5 - lenR5, 0], color: '#55ff88', label: 'R', tRange: [0.55, 0.95] }
        ],
        dashedLines: [
          { from: [Ax5, yTop5, 0], to: [Bx5, yTop5, 0], tRange: [0, 0.3], color: 'rgba(255,255,255,0.35)' }
        ],
        legend: [
          { color: '#ff5555', text: 'P = 20 — force appliquée en A' },
          { color: '#55aaff', text: 'Q = 15 — force appliquée en B' },
          { color: '#55ff88', text: 'R = P + Q = 35 — appliquée en C' },
          { color: '#888',    text: 'AC / CB = Q / P = 15 / 20 = 3 / 4' }
        ]
      };

    // --------------------------------------------------------
    // FIGURE 6 — Parallélogramme des forces
    //
    // AP et AQ sont des DEMI-DROITES dont la longueur
    // est IDENTIQUE à celle de AR (prolongée).
    // Ainsi les trois traits AP, AQ, AR ont la même longueur
    // visuelle : c'est plus élégant.
    // --------------------------------------------------------
    case 6:
      const SCALE_F6 = 6;

      // Angle entre les demi-droites AP et AQ
      const angleP6 = 0.65;    // ~37°
      const angleQ6 = -0.65;   // ~-37°

      // A en haut
      const A6 = [0, 0, 0];

      // Longueurs proportionnelles aux intensités
      const AB_len = 20 * SCALE_F6;   // 120
      const AC_len = 15 * SCALE_F6;   // 90

      // B sur la demi-droite AP
      const B6 = [
        -Math.sin(angleP6) * AB_len,
        -Math.cos(angleP6) * AB_len,
        0
      ];

      // C sur la demi-droite AQ
      const C6 = [
        -Math.sin(angleQ6) * AC_len,
        -Math.cos(angleQ6) * AC_len,
        0
      ];

      // D = B + C (4ᵉ sommet du parallélogramme)
      const D6 = [
        B6[0] + C6[0],
        B6[1] + C6[1],
        B6[2] + C6[2]
      ];

      // Longueur totale visuelle : on veut que AP, AQ et AR
      // aient la même longueur. AD ≈ |D6|, et on prolonge R
      // au-delà de D. On prend donc :
      //   R_total = |AD| + extension
      //   AP_total = R_total
      //   AQ_total = R_total
      const AD_len = Math.hypot(D6[0], D6[1]);

      // Prolongement de R au-delà de D
      const R_extension = 60;
      const R_total = AD_len + R_extension;

      // Longueur totale des demi-droites AP et AQ
      const RAY_LEN = R_total;

      // Extrémité des demi-droites (même longueur que R)
      const P_ray_end = [
        -Math.sin(angleP6) * RAY_LEN,
        -Math.cos(angleP6) * RAY_LEN,
        0
      ];

      const Q_ray_end = [
        -Math.sin(angleQ6) * RAY_LEN,
        -Math.cos(angleQ6) * RAY_LEN,
        0
      ];

      // Flèches P et Q : un peu plus courtes que les demi-droites
      // pour qu'on voie bien la flèche le long du trait
      const P_arrow_len = RAY_LEN * 0.85;
      const Q_arrow_len = RAY_LEN * 0.85;

      const P_end = [
        -Math.sin(angleP6) * P_arrow_len,
        -Math.cos(angleP6) * P_arrow_len,
        0
      ];

      const Q_end = [
        -Math.sin(angleQ6) * Q_arrow_len,
        -Math.cos(angleQ6) * Q_arrow_len,
        0
      ];

      // R : flèche verte de A vers R_end
      const R_end = [
        D6[0] + (D6[0] / AD_len) * R_extension,
        D6[1] + (D6[1] / AD_len) * R_extension,
        0
      ];

      return {
        caption: "Parallélogramme des forces — P = 20, Q = 15, R = 35",

        // Demi-droites AP et AQ, mêmes longueurs que AR
        rays: [
          { from: A6, to: P_ray_end, color: 'rgba(255,120,120,0.40)', tRange: [0.00, 0.30] },
          { from: A6, to: Q_ray_end, color: 'rgba(120,180,255,0.40)', tRange: [0.00, 0.30] }
        ],

        points: [
          { pos: A6, color: '#ffffff', label: 'A' },
          { pos: B6, color: '#ff5555', label: 'B' },
          { pos: C6, color: '#55aaff', label: 'C' },
          { pos: D6, color: '#55ff88', label: 'D' }
        ],

        arrows: [
          { from: A6, to: P_end, color: '#ff5555', label: 'P', tRange: [0.15, 0.50] },
          { from: A6, to: Q_end, color: '#55aaff', label: 'Q', tRange: [0.30, 0.60] },
          { from: A6, to: R_end, color: '#55ff88', label: 'R', tRange: [0.70, 1.00] }
        ],

        dashedLines: [
          // BD : côté du parallélogramme
          { from: B6, to: D6, tRange: [0.55, 0.80], color: 'rgba(180,180,200,0.55)' },
          // CD : côté du parallélogramme
          { from: C6, to: D6, tRange: [0.60, 0.85], color: 'rgba(180,180,200,0.55)' },
          // AD : diagonale (vert pointillé)
          { from: A6, to: D6, tRange: [0.35, 0.60], color: 'rgba(85,255,136,0.7)' }
        ],

        legend: [
          { color: '#ff5555', text: 'P = 20 — force portée par la demi-droite AP' },
          { color: '#55aaff', text: 'Q = 15 — force portée par la demi-droite AQ' },
          { color: '#55ff88', text: 'R = 35 — résultante (diagonale AD prolongée)' },
          { color: '#888',    text: 'AB = 20, AC = 15, AD = 35 (proportionnels)' }
        ]
      };
  }
}

// ============================================================
//  LÉGENDE ÉLÉGANTE
// ============================================================
function drawLegend(legend) {
  const padding = 16;
  const lineHeight = 24;
  const dotRadius = 5;
  const panelW = 480;
  const panelH = padding * 2 + legend.length * lineHeight;
  const panelX = 30;
  const panelY = H - panelH - 30;

  ctx.save();
  ctx.fillStyle = 'rgba(18, 18, 24, 0.78)';
  ctx.strokeStyle = 'rgba(90, 90, 110, 0.4)';
  ctx.lineWidth = 1;

  roundRect(ctx, panelX, panelY, panelW, panelH, 8);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  legend.forEach((item, i) => {
    const y = panelY + padding + i * lineHeight + lineHeight / 2;
    const dotX = panelX + padding + dotRadius;
    const textX = dotX + dotRadius + 14;

    ctx.fillStyle = item.color;
    ctx.beginPath();
    ctx.arc(dotX, y, dotRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.arc(dotX, y, dotRadius + 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#ccc';
    ctx.font = '13px Georgia, serif';
    ctx.fillText(item.text, textX, y + 1);
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
//  BOUCLE PRINCIPALE
// ============================================================
function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}

function drawScene(now) {
  if (animStartTime === null) animStartTime = now;
  if (!animDone) {
    const elapsed = now - animStartTime;
    animProgress = Math.min(elapsed / appearanceDuration, 1);
    if (animProgress >= 1) animDone = true;
  }

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  drawFloorGrid();

  const scene = getFigureScene(currentFigure);

  // Demi-droites (tracées en premier)
  if (scene.rays) {
    scene.rays.forEach(r => {
      const t = clampProgress(animProgress, r.tRange);
      if (t <= 0) return;
      drawLine3D(r.from, r.to, r.color, 0.9, false, t);
    });
  }

  // Lignes pointillées
  scene.dashedLines.forEach(dl => {
    const t = clampProgress(animProgress, dl.tRange);
    if (t <= 0) return;
    drawLine3D(dl.from, dl.to, dl.color || 'rgba(255,255,255,0.35)', 1.5, true, t);
  });

  // Flèches
  scene.arrows.forEach(a => {
    const t = clampProgress(animProgress, a.tRange);
    if (t <= 0) return;
    drawArrow3D(
      a.from[0], a.from[1], a.from[2],
      a.to[0],   a.to[1],   a.to[2],
      a.color, a.label, t,
      { dashed: a.dashed }
    );
  });

  // Points
  scene.points.forEach(pt => {
    drawPoint3D(pt.pos[0], pt.pos[1], pt.pos[2], pt.color, pt.label);
  });

  drawLegend(scene.legend);

  requestAnimationFrame(drawScene);
}

function clampProgress(p, [a, b]) {
  if (p <= a) return 0;
  if (p >= b) return 1;
  return easeOutCubic((p - a) / (b - a));
}

// ============================================================
//  ROTATION 3D
// ============================================================
canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  canvas.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastMouseX;
  const dy = e.clientY - lastMouseY;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  camTheta += dx * 0.008 * rotationSpeed;
  camPhi   -= dy * 0.008 * rotationSpeed;
  camPhi = Math.max(PHI_MIN, Math.min(PHI_MAX, camPhi));
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  canvas.classList.remove('dragging');
});

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    lastMouseX = e.touches[0].clientX;
    lastMouseY = e.touches[0].clientY;
    canvas.classList.add('dragging');
  }
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (!isDragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastMouseX;
  const dy = e.touches[0].clientY - lastMouseY;
  lastMouseX = e.touches[0].clientX;
  lastMouseY = e.touches[0].clientY;
  camTheta += dx * 0.008 * rotationSpeed;
  camPhi   -= dy * 0.008 * rotationSpeed;
  camPhi = Math.max(PHI_MIN, Math.min(PHI_MAX, camPhi));
}, { passive: true });
canvas.addEventListener('touchend', () => {
  isDragging = false;
  canvas.classList.remove('dragging');
});

// ============================================================
//  PANNEAU DRAG & DROP
// ============================================================
const panel = document.getElementById('panel');
const panelHeader = document.getElementById('panelHeader');
let panelDragging = false;
let panelOffsetX = 0, panelOffsetY = 0;

panelHeader.addEventListener('mousedown', (e) => {
  panelDragging = true;
  const rect = panel.getBoundingClientRect();
  panelOffsetX = e.clientX - rect.left;
  panelOffsetY = e.clientY - rect.top;
  e.stopPropagation();
});
window.addEventListener('mousemove', (e) => {
  if (!panelDragging) return;
  panel.style.left = (e.clientX - panelOffsetX) + 'px';
  panel.style.top  = (e.clientY - panelOffsetY) + 'px';
  panel.style.right = 'auto';
});
window.addEventListener('mouseup', () => { panelDragging = false; });

panelHeader.addEventListener('touchstart', (e) => {
  panelDragging = true;
  const rect = panel.getBoundingClientRect();
  panelOffsetX = e.touches[0].clientX - rect.left;
  panelOffsetY = e.touches[0].clientY - rect.top;
  e.stopPropagation();
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (!panelDragging) return;
  panel.style.left = (e.touches[0].clientX - panelOffsetX) + 'px';
  panel.style.top  = (e.touches[0].clientY - panelOffsetY) + 'px';
  panel.style.right = 'auto';
}, { passive: true });
window.addEventListener('touchend', () => { panelDragging = false; });

// ============================================================
//  CONTRÔLES
// ============================================================
const figSelect = document.getElementById('figSelect');
const figCaption = document.getElementById('figCaption');

figSelect.addEventListener('change', () => {
  currentFigure = parseInt(figSelect.value);
  figCaption.textContent = getFigureScene(currentFigure).caption;
  resetAnimation();
});

const durationSlider = document.getElementById('durationSlider');
const durationValue = document.getElementById('durationValue');
durationSlider.addEventListener('input', () => {
  appearanceDuration = parseInt(durationSlider.value);
  durationValue.textContent = (appearanceDuration / 1000).toFixed(1) + 's';
});

const rotSpeedSlider = document.getElementById('rotSpeed');
const rotSpeedValue = document.getElementById('rotSpeedValue');
rotSpeedSlider.addEventListener('input', () => {
  rotationSpeed = parseFloat(rotSpeedSlider.value);
  rotSpeedValue.textContent = rotationSpeed.toFixed(2);
});

const zoomSlider = document.getElementById('zoomSlider');
const zoomValue = document.getElementById('zoomValue');
zoomSlider.addEventListener('input', () => {
  zoomFactor = parseFloat(zoomSlider.value);
  zoomValue.textContent = zoomFactor.toFixed(2);
});

function resetAnimation() {
  animStartTime = null;
  animProgress = 0;
  animDone = false;
}
document.getElementById('replayBtn').addEventListener('click', resetAnimation);

// ============================================================
//  LANCEMENT
// ============================================================
figCaption.textContent = getFigureScene(1).caption;
requestAnimationFrame(drawScene);
</script>
