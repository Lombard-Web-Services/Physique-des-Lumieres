<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hydrostatique — Flux, sources et puits</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000;
    overflow: hidden; height: 100%;
    font-family: Georgia, 'Times New Roman', serif;
    color: #ddd; user-select: none;
  }
  canvas { display: block; cursor: grab; }
  canvas.dragging { cursor: none; }

  #panel {
    position: fixed; top: 20px; left: 20px;
    background: rgba(18, 18, 24, 0.92);
    border: 1px solid #3a3a44; border-radius: 10px;
    padding: 14px 16px; width: 290px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    z-index: 10; font-size: 12px;
    transition: width 0.25s ease, padding 0.25s ease, opacity 0.3s;
    overflow: hidden;
  }
  #panel.collapsed { width: 48px; padding: 10px 8px; }
  #panel.collapsed .panel-body,
  #panel.collapsed h3 .title-text { display: none; }
  #panel.collapsed h3 { justify-content: center; border-bottom: none; padding-bottom: 0; margin: 0; }
  #panel h3 {
    margin: 0 0 10px 0; font-size: 12px; color: #fff;
    font-weight: normal; letter-spacing: 2px;
    text-transform: uppercase; cursor: move;
    border-bottom: 1px solid #3a3a44;
    padding-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  #panel h3 .title-text { flex: 1; }
  #panel h3 .collapse-btn {
    background: transparent; border: 1px solid #555;
    color: #aaa; width: 22px; height: 22px;
    border-radius: 4px; cursor: pointer;
    font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0; transition: all 0.15s; flex-shrink: 0;
  }
  #panel h3 .collapse-btn:hover { background: #333; color: #fff; border-color: #888; }
  #panel h3 span.grip { color: #666; font-size: 14px; }
  #panel .row {
    display: flex; justify-content: space-between;
    align-items: center; margin: 8px 0; gap: 8px;
  }
  #panel label { flex: 1; color: #999; font-size: 11px; }
  #panel input[type="range"] { flex: 1.2; accent-color: #55ff88; height: 4px; }
  #panel select {
    flex: 1.4; background: #22222a; color: #fff;
    border: 1px solid #444; padding: 5px 6px;
    border-radius: 5px; font-family: inherit;
    font-size: 11px; cursor: pointer;
  }
  #panel .value {
    width: 45px; text-align: right; color: #55ff88;
    font-variant-numeric: tabular-nums; font-size: 11px;
  }
  #panel button {
    width: 100%; margin-top: 8px; background: #22222a;
    color: #ddd; border: 1px solid #444; padding: 7px;
    border-radius: 6px; cursor: pointer; font-family: inherit;
    font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; transition: all 0.2s;
  }
  #panel button:hover { background: #2e2e3a; border-color: #666; color: #fff; }
  #panel button.rec { background: #3a1a1a; border-color: #ff4040; color: #ff8080; }
  #panel button.rec:hover { background: #5a2020; color: #ffaaaa; }
  #panel .hint {
    font-size: 10px; color: #666; margin-top: 10px;
    line-height: 1.5; border-top: 1px solid #2a2a33;
    padding-top: 8px; font-style: italic;
  }
  #panel .checkbox-row {
    display: flex; align-items: center; gap: 6px; margin: 6px 0;
  }
  #panel .checkbox-row input { accent-color: #55ff88; cursor: pointer; }
  #panel .checkbox-row label { cursor: pointer; flex: 1; }
  #panel .section-title {
    font-size: 10px; color: #55ff88; margin-top: 12px;
    margin-bottom: 4px; text-transform: uppercase;
    letter-spacing: 1.5px; border-top: 1px solid #2a2a33;
    padding-top: 8px;
  }

  /* ============ LÉGENDE HTML DRAG & DROPPABLE ============ */
  #legend {
    position: fixed; bottom: 30px; left: 30px;
    background: rgba(18, 18, 24, 0.92);
    border: 1px solid rgba(120, 120, 150, 0.55);
    border-radius: 12px;
    z-index: 20;
    min-width: 260px; max-width: 340px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    transition: box-shadow 0.2s, opacity 0.3s;
  }
  #legend:hover { box-shadow: 0 8px 40px rgba(85, 255, 136, 0.15); }

  #legend .legend-header {
    padding: 12px 18px;
    display: flex; justify-content: space-between;
    align-items: center;
    color: #55ff88;
    font-family: Georgia, serif;
    font-weight: normal;
    font-size: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: move;
    user-select: none;
    border-bottom: 1px solid rgba(85, 255, 136, 0.2);
  }
  #legend .legend-header .grip {
    color: #666; font-size: 14px; letter-spacing: 0;
    margin-right: 8px;
  }
  #legend .legend-header .collapse {
    color: #888; font-size: 14px;
    cursor: pointer; padding: 2px 6px;
    transition: transform 0.3s;
  }
  #legend.collapsed .legend-header .collapse { transform: rotate(-90deg); }
  #legend .legend-header .collapse:hover { color: #55ff88; }

  #legend .legend-body {
    padding: 14px 18px 16px 18px;
    max-height: 500px;
    transition: max-height 0.3s, padding 0.3s, opacity 0.3s;
    opacity: 1;
  }
  #legend.collapsed .legend-body {
    max-height: 0; padding-top: 0; padding-bottom: 0;
    opacity: 0;
  }

  #legend .legend-item {
    display: flex; align-items: center;
    gap: 12px; margin: 10px 0;
    font-family: Georgia, serif;
    font-size: 15px;
    color: #e8e8e8;
    line-height: 1.35;
    font-style: italic;
    letter-spacing: 0.3px;
  }
  #legend .legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 10px currentColor;
  }

  /* ============ MODE ENREGISTREMENT ============ */
  body.recording #panel { opacity: 0 !important; pointer-events: none !important; }
  body.recording #legend { opacity: 0 !important; pointer-events: none !important; }

  #recordingExit {
    display: none; position: fixed; top: 16px; right: 16px;
    z-index: 100; background: rgba(200, 40, 40, 0.85); color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 12px;
    letter-spacing: 1px; text-transform: uppercase;
    backdrop-filter: blur(4px);
  }
  body.recording #recordingExit { display: block; }
  #recordingExit:hover { background: rgba(230, 60, 60, 0.95); }

  #recIndicator {
    display: none; position: fixed; top: 16px; left: 16px;
    z-index: 100; background: rgba(30, 0, 0, 0.85); color: #fff;
    border: 1px solid rgba(255, 60, 60, 0.6);
    padding: 8px 14px; border-radius: 6px;
    font-family: 'Courier New', monospace; font-size: 13px;
    letter-spacing: 1px; backdrop-filter: blur(4px);
    align-items: center; gap: 10px;
  }
  body.recording #recIndicator { display: flex; }
  #recIndicator .rec-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #ff2222; animation: rec-pulse 1s infinite;
  }
  @keyframes rec-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.85); }
  }

  #recordingNav {
    display: none; position: fixed; bottom: 16px; right: 16px;
    z-index: 100; background: rgba(18, 18, 24, 0.85); color: #aaa;
    border: 1px solid rgba(90,90,110,0.5);
    padding: 8px 14px; border-radius: 6px;
    font-family: inherit; font-size: 12px;
    letter-spacing: 0.5px; backdrop-filter: blur(4px);
    pointer-events: none;
  }
  body.recording #recordingNav { display: block; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="panel">
  <h3 id="panelHeader">
    <span class="title-text">Paramètres</span>
    <span class="grip">⠿</span>
    <button class="collapse-btn" id="collapseBtn" title="Réduire / déplier">−</button>
  </h3>

  <div class="panel-body">
    <div class="row">
      <label>Figure</label>
      <select id="figureSelect">
        <option value="source">Source seule</option>
        <option value="puit">Puits seul</option>
        <option value="dipole">Dipôle (source + puits)</option>
        <option value="two+">Deux sources</option>
        <option value="hexapole">Hexapôle (3 sources + 3 puits)</option>
        <option value="line">Ligne de sources</option>
      </select>
    </div>

    <div class="section-title">Flux hydrostatique</div>
    <div class="checkbox-row">
      <input type="checkbox" id="showArrows" checked>
      <label for="showArrows">Petites flèches</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="showStream" checked>
      <label for="showStream">Lignes de courant</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="showFlow" checked>
      <label for="showFlow">Flux animé</label>
    </div>
    <div class="row">
      <label>Densité</label>
      <input type="range" id="density" min="20" max="70" step="1" value="45">
      <span class="value" id="densityValue">45</span>
    </div>
    <div class="row">
      <label>Vitesse flux</label>
      <input type="range" id="flowSpeed" min="0.1" max="3" step="0.1" value="1.2">
      <span class="value" id="flowSpeedValue">1.2</span>
    </div>
    <div class="row">
      <label>Taille flèches</label>
      <input type="range" id="arrowSize" min="3" max="15" step="1" value="6">
      <span class="value" id="arrowSizeValue">6</span>
    </div>

    <div class="section-title">Enregistrement</div>
    <div class="checkbox-row">
      <input type="checkbox" id="showTitleRec" checked>
      <label for="showTitleRec">Titre + équation + auteurs</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="showLegendRec" checked>
      <label for="showLegendRec">Afficher la légende</label>
    </div>
    <div class="row">
      <label>Résolution</label>
      <select id="resSelect">
        <option value="auto">Auto (fenêtre)</option>
        <option value="1080">1920 × 1080 (Full HD)</option>
        <option value="1440">2560 × 1440 (QHD)</option>
        <option value="2160">3840 × 2160 (4K)</option>
      </select>
    </div>

    <button id="recordBtn">● Enregistrer (Espace)</button>
    <button id="replayBtn">↻ Reset (R)</button>

    <div class="hint">
      ← → : figure · Espace : enregistrer · R : reset<br>
      Clic + glisser : tourner · Molette : zoom
    </div>
  </div>
</div>

<button id="recordingExit">■ Arrêter &amp; télécharger</button>

<div id="recIndicator">
  <div class="rec-dot"></div>
  <span id="recTime">REC 00:00</span>
</div>

<div id="recordingNav">← → : changer de figure</div>

<!-- Légende HTML drag & droppable -->
<div id="legend">
  <div class="legend-header" id="legendHeader">
    <span><span class="grip">⠿</span>Légende</span>
    <span class="collapse" id="legendCollapse">▼</span>
  </div>
  <div class="legend-body" id="legendBody"></div>
</div>

<script>
// ============================================================
//  CANVAS
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

let recordingResolution = null;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { if (!isRecording) resize(); });
resize();

// ============================================================
//  FIGURES HYDROSTATIQUES
// ============================================================
const FIGURES = {
  'source':  [{ pos: [0, 0, 0], sign: +1 }],
  'puit':    [{ pos: [0, 0, 0], sign: -1 }],
  'dipole':  [
    { pos: [-140, 0, 0], sign: +1 },
    { pos: [ 140, 0, 0], sign: -1 }
  ],
  'two+':    [
    { pos: [-140, 0, 0], sign: +1 },
    { pos: [ 140, 0, 0], sign: +1 }
  ],
  'hexapole': [
    { pos: [-180,  100, 0], sign: +1 },
    { pos: [   0,  100, 0], sign: +1 },
    { pos: [ 180,  100, 0], sign: +1 },
    { pos: [-180, -100, 0], sign: -1 },
    { pos: [   0, -100, 0], sign: -1 },
    { pos: [ 180, -100, 0], sign: -1 }
  ],
  'line':    [
    { pos: [-240, 0, 0], sign: +1 },
    { pos: [-120, 0, 0], sign: +1 },
    { pos: [   0, 0, 0], sign: +1 },
    { pos: [ 120, 0, 0], sign: +1 },
    { pos: [ 240, 0, 0], sign: +1 }
  ]
};

const FIGURE_ORDER = ['source', 'puit', 'dipole', 'two+', 'hexapole', 'line'];

const FIGURE_META = {
  'source': {
    title: 'Source ponctuelle',
    equation: 'v(r) = Q / (4πr²)',
    authors: 'd\'après Laplace & Poisson'
  },
  'puit': {
    title: 'Puits ponctuel',
    equation: 'v(r) = −Q / (4πr²)',
    authors: 'd\'après Laplace & Poisson'
  },
  'dipole': {
    title: 'Dipôle hydrodynamique',
    equation: 'v(r) = (Q / 4π) · (1/r₁² − 1/r₂²)',
    authors: 'd\'après Stokes & Lamb'
  },
  'two+': {
    title: 'Deux sources',
    equation: 'v(r) = Σ Qᵢ / (4π|r − rᵢ|²)',
    authors: 'd\'après Lagrange'
  },
  'hexapole': {
    title: 'Hexapôle hydrodynamique',
    equation: 'v(r) = Σᵢ₌₁⁶ Qᵢ / (4π|r − rᵢ|²)',
    authors: 'd\'après Maxwell & Rayleigh'
  },
  'line': {
    title: 'Ligne de sources',
    equation: 'v(r) = λ / (2πr)  ·  ligne infinie',
    authors: 'd\'après Gauss'
  }
};

const FIGURE_LEGENDS = {
  'source': [
    { color: '#ff5555', text: 'Source (+)' },
    { color: '#ffcc55', text: 'Petites flèches de flux' },
    { color: '#64dcff', text: 'Particules animées' }
  ],
  'puit': [
    { color: '#55aaff', text: 'Puits (−)' },
    { color: '#ffcc55', text: 'Petites flèches de flux' },
    { color: '#64dcff', text: 'Particules animées' }
  ],
  'dipole': [
    { color: '#ff5555', text: 'Source (+) à gauche' },
    { color: '#55aaff', text: 'Puits (−) à droite' },
    { color: '#ffcc55', text: 'Petites flèches de flux' },
    { color: '#64dcff', text: 'Particules animées' }
  ],
  'two+': [
    { color: '#ff5555', text: 'Source +₁ (gauche)' },
    { color: '#ff8844', text: 'Source +₂ (droite)' },
    { color: '#ffcc55', text: 'Petites flèches de flux' }
  ],
  'hexapole': [
    { color: '#ff5555', text: '3 sources + (haut)' },
    { color: '#55aaff', text: '3 puits − (bas)' },
    { color: '#ffcc55', text: 'Petites flèches de flux' },
    { color: '#64dcff', text: 'Particules animées' }
  ],
  'line': [
    { color: '#ff5555', text: '5 sources + alignées' },
    { color: '#ffcc55', text: 'Petites flèches de flux' }
  ]
};

// ============================================================
//  PARAMÈTRES
// ============================================================
let currentFigure = 'dipole';
let showArrows = true;
let showFlow = true;
let showStream = true;
let density = 45;
let flowSpeed = 1.2;
let arrowSize = 6;

let showTitleInRecording = true;
let showLegendInRecording = true;

// ============================================================
//  CAMÉRA
// ============================================================
let camTheta = 0.0;
let camPhi = 0.0;
let zoomFactor = 1.5;
let isDragging = false;
let lastMouseX = 0, lastMouseY = 0;
const PHI_MIN = -Math.PI / 2 + 0.05;
const PHI_MAX =  Math.PI / 2 - 0.05;

// ============================================================
//  ÉTAT ANIMATION
// ============================================================
let lastFrameTime = null;
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let recordingStartTime = 0;
let recordingTimerInterval = null;
let savedW = 0, savedH = 0;

// ============================================================
//  PROJECTION 3D
// ============================================================
const FOCAL = 900;
function project(x, y, z) {
  const cosT = Math.cos(camTheta), sinT = Math.sin(camTheta);
  let x1 =  x * cosT + z * sinT;
  let z1 = -x * sinT + z * cosT;
  let y1 =  y;

  const cosP = Math.cos(camPhi), sinP = Math.sin(camPhi);
  let y2 = y1 * cosP - z1 * sinP;
  let z2 = y1 * sinP + z1 * cosP;
  let x2 = x1;

  const camDist = 900;
  const zCam = z2 + camDist;
  const scale = (FOCAL / zCam) * zoomFactor;

  return { x: W / 2 + x2 * scale, y: H / 2 - y2 * scale, z: zCam, scale: scale };
}

// ============================================================
//  CHAMP DE VITESSE
// ============================================================
function computeFieldAt(px, py, pz, charges) {
  let ex = 0, ey = 0, ez = 0;
  charges.forEach(c => {
    const dx = px - c.pos[0];
    const dy = py - c.pos[1];
    const dz = pz - c.pos[2];
    const r2 = dx*dx + dy*dy + dz*dz;
    if (r2 < 1e-4) return;
    const r = Math.sqrt(r2);
    const factor = c.sign / (r2 * r);
    ex += factor * dx;
    ey += factor * dy;
    ez += factor * dz;
  });
  return [ex, ey, ez];
}

// ============================================================
//  FLÈCHE 2D
// ============================================================
function drawArrow2D(x1, y1, x2, y2, color, lineWidth, headLen) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 0.5) return;
  const ang = Math.atan2(dy, dx);

  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(ang - Math.PI / 6),
             y2 - headLen * Math.sin(ang - Math.PI / 6));
  ctx.lineTo(x2 - headLen * Math.cos(ang + Math.PI / 6),
             y2 - headLen * Math.sin(ang + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
}

// ============================================================
//  SOURCES / PUITS
// ============================================================
function drawSources(charges) {
  charges.forEach(c => {
    const p = project(c.pos[0], c.pos[1], c.pos[2]);
    const r = 9 * p.scale;
    const color = c.sign > 0 ? '#ff3030' : '#3080ff';
    const glow  = c.sign > 0 ? 'rgba(255, 80, 80,' : 'rgba(80, 160, 255,';

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = glow + '0.8)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.2 * p.scale;
    ctx.beginPath();
    ctx.moveTo(p.x - r * 0.55, p.y);
    ctx.lineTo(p.x + r * 0.55, p.y);
    if (c.sign > 0) {
      ctx.moveTo(p.x, p.y - r * 0.55);
      ctx.lineTo(p.x, p.y + r * 0.55);
    }
    ctx.stroke();
  });
}

// ============================================================
//  PETITES FLÈCHES
// ============================================================
function drawFieldArrows(charges) {
  const range = 440;
  const n = density;
  const step = (range * 2) / n;

  for (let i = 0; i <= n; i++) {
    for (let j = 0; j <= n; j++) {
      const x = -range + i * step;
      const y = -range + j * step;

      let tooClose = false;
      for (const c of charges) {
        const dx = x - c.pos[0];
        const dy = y - c.pos[1];
        if (dx*dx + dy*dy < 1200) { tooClose = true; break; }
      }
      if (tooClose) continue;

      const [ex, ey] = computeFieldAt(x, y, 0, charges);
      const eMag = Math.hypot(ex, ey);
      if (eMag < 1e-6) continue;

      const ux = ex / eMag;
      const uy = ey / eMag;
      const len = arrowSize * Math.min(1.4, Math.pow(eMag * 60, 0.3));

      const x1 = x - ux * len * 0.5;
      const y1 = y - uy * len * 0.5;
      const x2 = x + ux * len * 0.5;
      const y2 = y + uy * len * 0.5;

      const p1 = project(x1, y1, 0);
      const p2 = project(x2, y2, 0);

      const t = Math.min(1, Math.pow(eMag * 100, 0.4));
      let color;
      if (t > 0.66) {
        const s = (t - 0.66) / 0.34;
        color = `rgba(255, ${Math.round(120 + 80 * (1 - s))}, ${Math.round(60 * (1 - s))}, 0.95)`;
      } else if (t > 0.33) {
        const s = (t - 0.33) / 0.33;
        color = `rgba(${Math.round(255 - 100 * s)}, ${Math.round(220 + 20 * s)}, ${Math.round(80 + 120 * s)}, 0.9)`;
      } else {
        const s = t / 0.33;
        color = `rgba(${Math.round(80 - 30 * s)}, ${Math.round(180 - 60 * s)}, ${Math.round(255 - 60 * s)}, 0.8)`;
      }

      const lineW = (0.4 + 0.9 * t) * p1.scale;
      const headLen = (1.5 + 2.2 * t) * p1.scale;
      drawArrow2D(p1.x, p1.y, p2.x, p2.y, color, lineW, headLen);
    }
  }
}

// ============================================================
//  LIGNES DE COURANT
// ============================================================
function drawStreamlines(charges) {
  charges.forEach(c => {
    if (c.sign < 0) return;
    const nLines = 16;
    for (let k = 0; k < nLines; k++) {
      const a0 = (k / nLines) * Math.PI * 2;
      let x = c.pos[0] + Math.cos(a0) * 15;
      let y = c.pos[1] + Math.sin(a0) * 15;
      let z = c.pos[2];
      const pts = [];
      const stepSize = 6;
      for (let s = 0; s < 120; s++) {
        const [ex, ey, ez] = computeFieldAt(x, y, z, charges);
        const em = Math.hypot(ex, ey, ez);
        if (em < 1e-7) break;
        const ux = ex / em, uy = ey / em, uz = ez / em;
        x += ux * stepSize;
        y += uy * stepSize;
        z += uz * stepSize;
        pts.push([x, y, z]);

        let hit = false;
        for (const c2 of charges) {
          if (c2.sign < 0) {
            const ddx = x - c2.pos[0];
            const ddy = y - c2.pos[1];
            const ddz = z - c2.pos[2];
            if (ddx*ddx + ddy*ddy + ddz*ddz < 200) { hit = true; break; }
          }
        }
        if (hit) break;
        if (Math.abs(x) > 500 || Math.abs(y) > 500) break;
      }
      if (pts.length < 3) continue;

      ctx.beginPath();
      const p0 = project(...pts[0]);
      ctx.moveTo(p0.x, p0.y);
      for (let s = 1; s < pts.length; s++) {
        const pp = project(...pts[s]);
        ctx.lineTo(pp.x, pp.y);
      }
      ctx.strokeStyle = 'rgba(120, 180, 255, 0.22)';
      ctx.lineWidth = 1.0 * p0.scale;
      ctx.stroke();
    }
  });
}

// ============================================================
//  FLUX ANIMÉ
// ============================================================
let flowParticles = [];

function initFlowParticles() {
  flowParticles = [];
  const N = 250;
  for (let i = 0; i < N; i++) {
    flowParticles.push({ x: 0, y: 0, z: 0, life: 0, maxLife: 0, active: false });
  }
}

function respawnParticle(p) {
  const charges = getCurrentCharges();
  const positives = charges.filter(c => c.sign > 0);
  if (positives.length > 0) {
    const c = positives[Math.floor(Math.random() * positives.length)];
    const a = Math.random() * Math.PI * 2;
    const r = 18 + Math.random() * 25;
    p.x = c.pos[0] + Math.cos(a) * r;
    p.y = c.pos[1] + Math.sin(a) * r;
    p.z = c.pos[2];
  } else {
    const a = Math.random() * Math.PI * 2;
    const r = 50 + Math.random() * 300;
    p.x = Math.cos(a) * r;
    p.y = Math.sin(a) * r;
    p.z = 0;
  }
  p.life = 0;
  p.maxLife = 1.5 + Math.random() * 1.5;
  p.active = true;
}

function updateFlowParticles(dt, charges) {
  const baseSpeed = 100 * flowSpeed;
  flowParticles.forEach(p => {
    if (!p.active) { respawnParticle(p); return; }

    const [ex, ey, ez] = computeFieldAt(p.x, p.y, p.z, charges);
    const em = Math.hypot(ex, ey, ez);
    if (em > 1e-6) {
      const speedFactor = Math.min(2.5, Math.pow(em * 100, 0.3));
      const speed = baseSpeed * speedFactor;
      p.x += (ex / em) * speed * dt;
      p.y += (ey / em) * speed * dt;
      p.z += (ez / em) * speed * dt;
    }
    p.life += dt;

    let dead = false;
    if (p.life > p.maxLife) dead = true;
    if (Math.abs(p.x) > 500 || Math.abs(p.y) > 500) dead = true;

    for (const c of charges) {
      if (c.sign < 0) {
        const ddx = p.x - c.pos[0];
        const ddy = p.y - c.pos[1];
        const ddz = p.z - c.pos[2];
        if (ddx*ddx + ddy*ddy + ddz*ddz < 100) { dead = true; break; }
      }
    }
    if (dead) respawnParticle(p);
  });
}

function drawFlowParticles(charges) {
  flowParticles.forEach(p => {
    if (!p.active) return;
    const [ex, ey] = computeFieldAt(p.x, p.y, p.z, charges);
    const em = Math.hypot(ex, ey);
    if (em < 1e-7) return;

    const pp = project(p.x, p.y, p.z);
    const lifeRatio = p.life / p.maxLife;
    const alpha = Math.sin(lifeRatio * Math.PI) * 0.95;

    const size = 1.2 + 1.8 * Math.min(1, Math.pow(em * 80, 0.4));
    const t = Math.min(1, Math.pow(em * 100, 0.4));
    let color;
    if (t > 0.6) color = `rgba(255, 220, 120, ${alpha})`;
    else if (t > 0.3) color = `rgba(150, 230, 255, ${alpha})`;
    else color = `rgba(100, 180, 255, ${alpha})`;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, size * pp.scale * 1.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.7})`;
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, size * pp.scale * 0.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ============================================================
//  TITRE + ÉQUATION + AUTEURS (dans le canvas, pendant l'enregistrement)
// ============================================================
function drawFigureTitleInCanvas() {
  if (!isRecording || !showTitleInRecording) return;

  const meta = FIGURE_META[currentFigure];
  if (!meta) return;

  const s = Math.min(W / 1920, H / 1080);
  const sClamped = Math.max(0.6, Math.min(2.5, s));

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  // --- TITRE ---
  const titleY = Math.round(28 * sClamped);
  ctx.font = `italic ${Math.round(34 * sClamped)}px Georgia, serif`;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
  ctx.fillText(meta.title, W / 2 + 2, titleY + 2);
  ctx.fillStyle = '#f5f5f5';
  ctx.shadowColor = 'rgba(255,255,255,0.18)';
  ctx.shadowBlur = 20;
  ctx.fillText(meta.title, W / 2, titleY);
  ctx.shadowBlur = 0;

  // --- LIGNE DE SÉPARATION ---
  const ruleW = 160 * sClamped;
  const ruleY = titleY + Math.round(52 * sClamped);
  const grad = ctx.createLinearGradient(W / 2 - ruleW / 2, 0, W / 2 + ruleW / 2, 0);
  grad.addColorStop(0, 'rgba(120, 120, 120, 0)');
  grad.addColorStop(0.5, 'rgba(220, 220, 220, 0.7)');
  grad.addColorStop(1, 'rgba(120, 120, 120, 0)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - ruleW / 2, ruleY);
  ctx.lineTo(W / 2 + ruleW / 2, ruleY);
  ctx.stroke();

  // --- ÉQUATION ---
  const eqY = ruleY + Math.round(18 * sClamped);
  ctx.font = `italic ${Math.round(22 * sClamped)}px Georgia, serif`;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
  ctx.fillText(meta.equation, W / 2 + 1, eqY + 1);
  ctx.fillStyle = '#b8e6ff';
  ctx.shadowColor = 'rgba(120,180,255,0.25)';
  ctx.shadowBlur = 14;
  ctx.fillText(meta.equation, W / 2, eqY);
  ctx.shadowBlur = 0;

  // --- AUTEURS ---
  const authY = eqY + Math.round(34 * sClamped);
  ctx.font = `italic ${Math.round(16 * sClamped)}px Georgia, serif`;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillText(meta.authors, W / 2 + 1, authY + 1);
  ctx.fillStyle = '#a0a0b0';
  ctx.fillText(meta.authors, W / 2, authY);

  ctx.restore();
}

// ============================================================
//  LÉGENDE DANS LE CANVAS (pendant l'enregistrement)
// ============================================================
function drawLegendInCanvas() {
  if (!isRecording || !showLegendInRecording) return;

  const items = FIGURE_LEGENDS[currentFigure] || [];
  if (items.length === 0) return;

  const s = Math.min(W / 1920, H / 1080);
  const sClamped = Math.max(0.6, Math.min(2.5, s));

  const padding = Math.round(20 * sClamped);
  const lineHeight = Math.round(34 * sClamped);
  const dotRadius = Math.round(7 * sClamped);
  const fontSize = Math.round(18 * sClamped);
  const textPadding = Math.round(16 * sClamped);

  ctx.save();
  let maxW = 0;
  items.forEach(item => {
    ctx.font = `${fontSize}px Georgia, serif`;
    const w = ctx.measureText(item.text).width;
    if (w > maxW) maxW = w;
  });
  ctx.restore();

  const panelW = maxW + padding * 2 + dotRadius * 2 + textPadding;
  const panelH = padding * 2 + items.length * lineHeight;
  const panelX = (W - panelW) / 2;
  const panelY = H - panelH - Math.round(30 * sClamped);

  // Fond + bordure
  ctx.save();
  ctx.fillStyle = 'rgba(18, 18, 24, 0.85)';
  ctx.strokeStyle = 'rgba(120, 120, 150, 0.55)';
  ctx.lineWidth = 1.4;
  roundRectPath(ctx, panelX, panelY, panelW, panelH, 12 * sClamped);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // En-tête "LÉGENDE"
  const headerFontSize = Math.round(14 * sClamped);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `${headerFontSize}px Georgia, serif`;
  ctx.fillStyle = 'rgba(85, 255, 136, 0.85)';
  ctx.fillText('LÉGENDE', W / 2, panelY + padding * 0.4);
  ctx.restore();

  // Trait sous l'en-tête
  const headerRuleY = panelY + padding * 0.4 + headerFontSize + 6 * sClamped;
  const headerRuleW = panelW - padding * 2;
  const hGrad = ctx.createLinearGradient(panelX + padding, 0, panelX + padding + headerRuleW, 0);
  hGrad.addColorStop(0, 'rgba(85, 255, 136, 0)');
  hGrad.addColorStop(0.5, 'rgba(85, 255, 136, 0.45)');
  hGrad.addColorStop(1, 'rgba(85, 255, 136, 0)');
  ctx.fillStyle = hGrad;
  ctx.fillRect(panelX + padding, headerRuleY, headerRuleW, 1);

  // Items
  const itemsStartY = headerRuleY + Math.round(12 * sClamped);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  items.forEach((item, i) => {
    const y = itemsStartY + i * lineHeight + lineHeight / 2;
    const dotX = panelX + padding + dotRadius;
    const textX = dotX + dotRadius + textPadding;

    // Halo
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = item.color;
    ctx.beginPath();
    ctx.arc(dotX, y, dotRadius + 4 * sClamped, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Point
    ctx.fillStyle = item.color;
    ctx.beginPath();
    ctx.arc(dotX, y, dotRadius, 0, Math.PI * 2);
    ctx.fill();

    // Texte
    ctx.fillStyle = '#e8e8e8';
    ctx.font = `italic ${fontSize}px Georgia, serif`;
    ctx.fillText(item.text, textX, y + 1);
  });
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
//  BOUCLE PRINCIPALE
// ============================================================
function getCurrentCharges() {
  return FIGURES[currentFigure] || FIGURES['dipole'];
}

function drawScene(now) {
  if (lastFrameTime === null) lastFrameTime = now;
  const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  const charges = getCurrentCharges();

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (showStream) drawStreamlines(charges);
  if (showArrows) drawFieldArrows(charges);
  if (showFlow) {
    updateFlowParticles(dt, charges);
    drawFlowParticles(charges);
  }
  drawSources(charges);

  // Titre + légende dans le canvas UNIQUEMENT pendant l'enregistrement
  // (hors enregistrement, ce sont les overlays HTML qui s'en chargent)
  if (isRecording) {
    drawFigureTitleInCanvas();
    drawLegendInCanvas();
  }

  requestAnimationFrame(drawScene);
}

document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;

  if (e.key === 'ArrowRight') {
    e.preventDefault();
    const idx = FIGURE_ORDER.indexOf(currentFigure);
    setFigure(FIGURE_ORDER[(idx + 1) % FIGURE_ORDER.length]);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    const idx = FIGURE_ORDER.indexOf(currentFigure);
    setFigure(FIGURE_ORDER[(idx - 1 + FIGURE_ORDER.length) % FIGURE_ORDER.length]);
  } else if (e.key === ' ') {
    e.preventDefault();
    toggleRecording();
  } else if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    resetAll();
  } else if (e.key === 'Escape' && isRecording) {
    stopRecordingAndDownload();
  }
});

function setFigure(name) {
  currentFigure = name;
  document.getElementById('figureSelect').value = name;
  initFlowParticles();
  updateLegend();
}

  lastMouseX = e.clientX; lastMouseY = e.clientY;
  camTheta += dx * 0.005;
  camPhi   -= dy * 0.005;
  camPhi = Math.max(PHI_MIN, Math.min(PHI_MAX, camPhi));
});

  canvas.classList.remove('dragging');
});

}, { passive: false });

    isDragging = true;
    lastMouseX = e.touches[0].clientX;
    lastMouseY = e.touches[0].clientY;
  }
}, { passive: true });

  if (!isDragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastMouseX;
  const dy = e.touches[0].clientY - lastMouseY;
  lastMouseX = e.touches[0].clientX;
  lastMouseY = e.touches[0].clientY;
  camTheta += dx * 0.005;
  camPhi   -= dy * 0.005;
  camPhi = Math.max(PHI_MIN, Math.min(PHI_MAX, camPhi));
}, { passive: true });

// ============================================================
//  ENREGISTREMENT VIDÉO HAUTE QUALITÉ
// ============================================================
const recTimeEl = document.getElementById('recTime');
const resSelect = document.getElementById('resSelect');

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `REC ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function pickBestMimeType() {
  const candidates = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
    'video/mp4;codecs=h264',
    'video/mp4'
  ];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function applyRecordingResolution() {
  const val = resSelect.value;
  if (val === 'auto') {
    recordingResolution = null;
  } else {
    const h = parseInt(val);
    const w = Math.round(h * 16 / 9);
    recordingResolution = { w, h };
  }
}

function toggleRecording() {
  if (!isRecording) startRecording();
  else stopRecordingAndDownload();
}

function startRecording() {
  if (isRecording) return;

  resetAll();
  applyRecordingResolution();

  savedW = W;
  savedH = H;

  if (recordingResolution) {
    W = canvas.width = recordingResolution.w;
    H = canvas.height = recordingResolution.h;
    canvas.style.width = savedW + 'px';
    canvas.style.height = savedH + 'px';
  }

  isRecording = true;
  document.body.classList.add('recording');

  const stream = canvas.captureStream(60);
  const mimeType = pickBestMimeType();

  if (!mimeType) {
    alert("Votre navigateur ne supporte pas l'enregistrement vidéo via MediaRecorder.");
    isRecording = false;
    document.body.classList.remove('recording');
    W = canvas.width = savedW;
    H = canvas.height = savedH;
    canvas.style.width = '';
    canvas.style.height = '';
    return;
  }

  let bitrate = 20_000_000;
  if (recordingResolution && recordingResolution.h >= 2160) bitrate = 60_000_000;
  else if (recordingResolution && recordingResolution.h >= 1440) bitrate = 35_000_000;
  else if (recordingResolution && recordingResolution.h >= 1080) bitrate = 20_000_000;

  try {
    mediaRecorder = new MediaRecorder(stream, {
      mimeType: mimeType,
      videoBitsPerSecond: bitrate
    });
  } catch (err) {
    alert("Impossible de démarrer l'enregistrement : " + err.message);
    isRecording = false;
    document.body.classList.remove('recording');
    W = canvas.width = savedW;
    H = canvas.height = savedH;
    canvas.style.width = '';
    canvas.style.height = '';
    return;
  }

  recordedChunks = [];
  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mimeType.split(';')[0] });
    const url = URL.createObjectURL(blob);

    const now = new Date();
    const stamp = now.getFullYear()
      + String(now.getMonth()+1).padStart(2,'0')
      + String(now.getDate()).padStart(2,'0') + '_'
      + String(now.getHours()).padStart(2,'0')
      + String(now.getMinutes()).padStart(2,'0')
      + String(now.getSeconds()).padStart(2,'0');

    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const resTag = recordingResolution ? `${recordingResolution.h}p` : 'auto';
    const filename = `hydro_${currentFigure}_${resTag}_${stamp}.${ext}`;

    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 15000);
    recordedChunks = [];
    mediaRecorder = null;

    W = canvas.width = savedW;
    H = canvas.height = savedH;
    canvas.style.width = '';
    canvas.style.height = '';

    // Restaure le bouton
    const btn = document.getElementById('recordBtn');
    btn.textContent = '● Enregistrer (Espace)';
    btn.classList.remove('rec');
  };

  mediaRecorder.start(100);
  recordingStartTime = performance.now();
  recTimeEl.textContent = 'REC 00:00';

  recordingTimerInterval = setInterval(() => {
    const elapsed = performance.now() - recordingStartTime;
    recTimeEl.textContent = formatTime(elapsed);
  }, 200);

  const btn = document.getElementById('recordBtn');
  btn.textContent = '■ Arrêter (Espace)';
  btn.classList.add('rec');
}

function stopRecordingAndDownload() {
  if (!isRecording) return;
  isRecording = false;

  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (recordingTimerInterval) {
    clearInterval(recordingTimerInterval);
    recordingTimerInterval = null;
  }

  document.body.classList.remove('recording');
}

document.getElementById('recordBtn').addEventListener('click', toggleRecording);
document.getElementById('replayBtn').addEventListener('click', resetAll);
document.getElementById('recordingExit').addEventListener('click', stopRecordingAndDownload);

// ============================================================
//  INITIALISATION
// ============================================================
setFigure('dipole');
requestAnimationFrame(drawScene);
</script>
</body>
